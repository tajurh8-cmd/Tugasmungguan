<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e31b2b">
<meta name="description" content="Dokumentasi kebersihan mingguan toko B378-FRC Malangbong">

<title>Dokumentasi Kebersihan Mingguan - B378</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#20242a;font-family:Arial,sans-serif;padding:12px}
main{max-width:900px;margin:auto}h1{font-size:20px;margin:4px 0}.sub{color:#68717d;font-size:13px;margin:0 0 14px}.brand{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.brand img{width:112px;height:auto;border-radius:5px}.brand h1{margin:0 0 4px}
.panel{background:#fff;border-radius:10px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}
select,input[type=text]{width:100%;padding:10px;border:1px solid #cfd5dc;border-radius:7px;font-size:14px;background:white}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.daytabs button{padding:10px 4px;background:#e8edf3;color:#344050;border-radius:7px;font-size:12px}
.daytabs button.active{background:#0756a5;color:white}
button{border:0;border-radius:7px;padding:11px;font-weight:700;cursor:pointer}
.work{border:1px solid #d9dee4;border-radius:9px;padding:10px;margin:10px 0;background:#fff}
.workhead{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.workhead input{flex:1;min-width:0;font-weight:700}
.remove{background:#ffebeb;color:#b4232d;padding:9px 11px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{border:1px dashed #b8c0ca;border-radius:8px;overflow:hidden;background:#f7f8fa;min-width:0}
.photo .tag{font-size:11px;font-weight:700;padding:7px;color:white;background:#333}
.photo.after .tag{background:#078b4b}
.photo img{display:block;width:100%;height:210px;object-fit:cover}
.photo .empty{height:210px;display:flex;align-items:center;justify-content:center;color:#8a929c;font-size:12px}
.photo label{display:block;margin:0;text-align:center;padding:9px;color:#0756a5;cursor:pointer}
.photo input{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
.primary{background:#e31b2b;color:#fff}.secondary{background:#e8edf3;color:#344050}.add{background:#0756a5;color:white;width:100%;margin-top:8px}
.hint{font-size:11px;color:#68717d;line-height:1.4}
canvas{display:none}
@media(min-width:650px){.pair{gap:12px}.photo img,.photo .empty{height:250px}.daytabs{grid-template-columns:repeat(7,1fr)}}
</style>
</head>

<button id="installApp" class="primary" style="display:none;width:100%;margin:0 0 12px">INSTALL APLIKASI</button>
<section class="panel">
<label for="day">PILIH HARI</label>
<select id="day">
<option value="0">Senin</option><option value="1">Selasa</option><option value="2">Rabu</option><option value="3">Kamis</option><option value="4">Jumat</option><option value="5">Sabtu</option><option value="6">Minggu</option>
</select>
<div class="daytabs" id="tabs">
<button data-day="0" class="active">Senin</button><button data-day="1">Selasa</button><button data-day="2">Rabu</button><button data-day="3">Kamis</button><button data-day="4">Jumat</button><button data-day="5">Sabtu</button><button data-day="6">Minggu</button>
</div>
</section>
<section class="panel">
<label for="area">AREA / LOKASI</label>
<input id="area" type="text" placeholder="Nama area">
<div id="works"></div>
<button class="add" id="add">+ TAMBAH PEKERJAAN</button>
</section>
<section class="panel">
<div class="actions">
<button class="primary" id="download">DOWNLOAD PNG HARI INI</button>
<button class="secondary" id="reset">RESET FOTO HARI INI</button>
</div>
<p class="hint">Foto dan nama pekerjaan tersimpan sementara di halaman ini selama halaman tidak dimuat ulang. Download satu file PNG untuk hari yang sedang dipilih.</p>
</section>
<canvas id="out" width="1200" height="1600"></canvas>
</main>
<script>
const dayNames=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const initial=[
 {area:'AREA TERAS',tasks:['Keset','Tong sampah','Genset']},
 {area:'AREA SALES',tasks:['All kaca bagian depan & dalam','Sarang laba-laba','Kebersihan kisi-kisi Campina, Wall’s & Nugget']},
 {area:'AREA TERAS',tasks:['Kebersihan keranjang belanja','Kolong rak reguler','Kolong freezer & chiller']},
 {area:'AREA SALES',tasks:['Cek general expired all item (input di aplikasi expired di tab)']},
 {area:'AREA GUDANG',tasks:['Grouping rak ATK','Grouping rak item kartonan','Penempelan label EXP','Pembuatan all retur']},
 {area:'AREA SALES',tasks:['Pengecekan label item tidak ada label price','Pengecekan item floor & FDU tidak ada POP']},
 {area:'AREA PARKIR',tasks:['Pengecekan lingkungan (halaman parkir & sekitar)']}
];
let state=initial.map(d=>({area:d.area,works:d.tasks.map(t=>({title:t,before:null,after:null,beforeName:'',afterName:''}))}));
let current=0;
const day=document.getElementById('day'),area=document.getElementById('area'),works=document.getElementById('works');
function setDay(n){current=Number(n);day.value=current;document.querySelectorAll('.daytabs button').forEach(b=>b.classList.toggle('active',Number(b.dataset.day)===current));area.value=state[current].area;render()}
day.addEventListener('change',()=>setDay(day.value));
document.querySelectorAll('.daytabs button').forEach(b=>b.addEventListener('click',()=>setDay(b.dataset.day)));
area.addEventListener('input',()=>{state[current].area=area.value;saveState()});
function render(){
 works.innerHTML='';
 state[current].works.forEach((w,i)=>{
  const el=document.createElement('div');el.className='work';
  el.innerHTML=`<div class="workhead"><input type="text" aria-label="Nama pekerjaan" value="${esc(w.title)}"><button class="remove" type="button">HAPUS</button></div>
  <div class="pair">
   <div class="photo"><div class="tag">BEFORE</div>${w.before?`<img src="${w.before}" alt="Before">`:'<div class="empty">Belum ada foto</div>'}<label>PILIH FOTO<input type="file" accept="image/*" data-side="before"></label></div>
   <div class="photo after"><div class="tag">AFTER</div>${w.after?`<img src="${w.after}" alt="After">`:'<div class="empty">Belum ada foto</div>'}<label>PILIH FOTO<input type="file" accept="image/*" data-side="after"></label></div>
  </div>`;
  const title=el.querySelector('.workhead input');title.addEventListener('input',()=>{w.title=title.value;saveState()});
  el.querySelector('.remove').addEventListener('click',()=>{state[current].works.splice(i,1);saveState();render()});
  el.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();reader.onload=()=>{w[inp.dataset.side]=reader.result;w[inp.dataset.side+'Name']=f.name;saveState();render()};reader.readAsDataURL(f);
  }));
  works.appendChild(el);
 });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('add').addEventListener('click',()=>{state[current].works.push({title:'Pekerjaan baru',before:null,after:null,beforeName:'',afterName:''});saveState();render()});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Hapus semua foto pada hari '+dayNames[current]+'?'))return;state[current].works.forEach(w=>{w.before=null;w.after=null;w.beforeName='';w.afterName=''});saveState();render()});
function loadImg(src){return new Promise((resolve,reject)=>{if(!src)return resolve(null);const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function drawCover(ctx,img,x,y,w,h){const sc=Math.max(w/img.width,h/img.height),sw=w/sc,sh=h/sc;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h)}
document.getElementById('download').addEventListener('click',async()=>{
 const c=document.getElementById('out'),ctx=c.getContext('2d'),list=state[current].works;
 // A4 portrait at 300 dpi (2480 x 3508 px). Draw in half-scale coordinates for crisp output.
 const W=1240,H=1754,S=2,headerH=190,top=220,footerH=30,bottom=30;
 c.width=W*S;c.height=H*S;
 ctx.setTransform(S,0,0,S,0,0);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#e31b2b';ctx.fillRect(0,0,W,headerH);
 const brandLogo=await loadImg('data:image/png;base64,' + document.querySelector('.brand img').src.split(',')[1]);
 const logoBox={x:30,y:38,w:180,h:90};
 const logoScale=Math.min(logoBox.w/brandLogo.width,logoBox.h/brandLogo.height);
 const logoW=brandLogo.width*logoScale,logoH=brandLogo.height*logoScale;
 ctx.drawImage(brandLogo,logoBox.x+(logoBox.w-logoW)/2,logoBox.y+(logoBox.h-logoH)/2,logoW,logoH);
 const textX=230,textW=980,textCenter=textX+textW/2;
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font='bold 35px Arial';
 let headerTitle='DOKUMENTASI KEBERSIHAN MINGGUAN';
 while(ctx.measureText(headerTitle).width>textW-20){ctx.font=(parseInt(ctx.font)-1)+'px Arial'}
 ctx.fillText(headerTitle,textCenter,55);
 ctx.font='bold 28px Arial';ctx.fillText('TOKO B378-FRC MALANGBONG',textCenter,105);
 ctx.font='22px Arial';ctx.fillText(dayNames[current].toUpperCase()+'  |  '+(state[current].area||'AREA'),textCenter,151);
 ctx.fillStyle='#ffdf00';ctx.fillRect(0,headerH-8,W,8);

 const margin=24,gap=22,boxW=(W-margin*2-gap)/2,barH=44,sectionGap=16;
 const available=H-top-footerH-bottom;
 const count=Math.max(list.length,1);
 const rowH=available/count;
 let y=top;
 for(let i=0;i<list.length;i++){
  const w=list[i];
  let photoH=Math.min(720,Math.max(125,rowH-barH-sectionGap-14));
  // Keep each task compact enough to remain on one A4 page, while prioritizing large photos.
  const sectionH=barH+sectionGap+photoH;
  ctx.fillStyle='#0756a5';ctx.fillRect(margin,y,W-margin*2,barH);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  const taskTitle=String(w.title||'PEKERJAAN').toUpperCase();
  let fs=25;ctx.font='bold '+fs+'px Arial';
  while(ctx.measureText(taskTitle).width>W-margin*2-36 && fs>15){fs--;ctx.font='bold '+fs+'px Arial'}
  ctx.fillText(taskTitle,W/2,y+barH/2);
  const photoY=y+barH+sectionGap;
  const specs=[{x:margin,side:'before',tag:'BEFORE',color:'#303030'},{x:margin+boxW+gap,side:'after',tag:'AFTER',color:'#078b4b'}];
  for(const spec of specs){
   const x=spec.x;
   ctx.fillStyle='#f1f2f3';ctx.fillRect(x,photoY,boxW,photoH);
   ctx.strokeStyle='#aeb5bc';ctx.lineWidth=2;ctx.strokeRect(x+1,photoY+1,boxW-2,photoH-2);
   if(w[spec.side]){
    const im=await loadImg(w[spec.side]);
    ctx.save();ctx.beginPath();ctx.rect(x+2,photoY+2,boxW-4,photoH-4);ctx.clip();
    drawCover(ctx,im,x+2,photoY+2,boxW-4,photoH-4);ctx.restore();
   }else{
    ctx.fillStyle='#858d96';ctx.font='20px Arial';ctx.textAlign='center';
    ctx.fillText('FOTO BELUM DIISI',x+boxW/2,photoY+photoH/2);
   }
   const tagW=136,tagH=38;ctx.fillStyle=spec.color;ctx.fillRect(x,photoY,tagW,tagH);
   ctx.fillStyle='#fff';ctx.font='bold 21px Arial';ctx.textAlign='center';ctx.fillText(spec.tag,x+tagW/2,photoY+tagH/2+1);
  }
  y+=sectionH+Math.max(8,(rowH-sectionH));
 }
 ctx.fillStyle='#e31b2b';ctx.fillRect(0,H-footerH,W,footerH);
 ctx.setTransform(1,0,0,1,0,0);
 c.toBlob(blob=>{
  if(!blob){alert('Gagal membuat PNG');return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Kebersihan_'+dayNames[current]+'_B378_A4.png';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500)
 },'image/png');
});
// Simpan foto dan pengaturan di perangkat agar tidak hilang saat aplikasi ditutup.
const DB_NAME='kebersihan-b378-db', DB_STORE='appdata';
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DB_STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveState(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('Penyimpanan lokal gagal',e)}}
async function restoreState(){try{const db=await openDB();const saved=await new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE).objectStore(DB_STORE).get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(Array.isArray(saved)&&saved.length===7)state=saved}catch(e){console.warn('Data lokal belum tersedia',e)}}
restoreState().finally(()=>setDay(0));
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW:',e)))}
let installPrompt=null;const installButton=document.getElementById('installApp');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.style.display='block'});
installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.style.display='none'});
window.addEventListener('appinstalled',()=>{installButton.style.display='none'});
</script>
